<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Split Expenses — say who paid, settle in the fewest payments">
  <style>
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="630" fill="#f3f3f3"/>

  <g fill="none" stroke="#121212">
    <g stroke-width="6" transform="translate(80 62) scale(.5)">
      <circle cx="22" cy="22" r="13"/>
      <circle cx="42" cy="42" r="13"/>
      <path d="m42 9-20 46" stroke-linecap="round"/>
    </g>
    <path d="M80 116h1040" stroke-width="1.5"/>
    <path d="M80 510h1040" stroke-width="1.5"/>
  </g>
  <text x="128" y="86" class="mono" fill="#121212" font-size="21" letter-spacing="4">SPLIT EXPENSES</text>

  <g class="serif" fill="#121212" font-size="100" letter-spacing="-3">
    <text x="80" y="250">Say who paid.</text>
    <text x="80" y="352">Settle in the</text>
    <text x="80" y="454">fewest payments.</text>
  </g>

  <text x="80" y="552" class="mono" fill="#6b6b6b" font-size="23" letter-spacing="4">NO ACCOUNT · NO SERVER · OPEN SOURCE AGENT SKILL</text>

  <g transform="translate(1010 300)" fill="none" stroke="#121212">
    <defs>
      <path id="card-seal" d="M0 0m-76 0a76 76 0 1 1 152 0a76 76 0 1 1-152 0"/>
    </defs>
    <circle r="95" stroke-width="1.4" opacity=".5"/>
    <circle r="59" stroke-width="1.4" opacity=".5"/>
    <text class="mono" fill="#121212" stroke="none" font-size="16.5" letter-spacing="3">
      <textPath href="#card-seal">NO ACCOUNT · NO SERVER · NO SIGN-UP · </textPath>
    </text>
    <g stroke-width="6" transform="translate(-28 -28) scale(.88)">
      <circle cx="22" cy="22" r="13"/>
      <circle cx="42" cy="42" r="13"/>
      <path d="m42 9-20 46" stroke-linecap="round"/>
    </g>
  </g>
</svg>
