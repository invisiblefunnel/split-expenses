name: Release

on:
  push:
    tags: ["v*"]

# Creating the release and attaching the asset both write to the repository.
permissions:
  contents: write

jobs:
  release:
    name: build and publish the skill bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A tag can point anywhere, so the suite runs again rather than trusting
      # that CI already covered whatever commit this one names.
      - name: Run the test suite
        run: python -m unittest discover -s tests

      # git archive, so the asset is the tagged tree by construction rather
      # than whatever the job happens to have on disk. The two pathspecs are
      # the bundle's contents, named explicitly: a file lands in a release
      # once it appears here and not merely because it was committed under
      # skills/. Renaming one without updating this fails the job — git exits
      # 128 on a pathspec that matches nothing.
      #
      # --prefix makes split-expenses/ the archive's single top-level entry.
      # SKILL.md loose at the root is the documented way for an upload to
      # fail, and it fails in a settings dialog nobody is watching a log for.
      - name: Build the skill bundle
        run: |
          mkdir -p dist
          git archive --format=zip \
            --prefix=split-expenses/ \
            -o dist/split-expenses.zip \
            "$GITHUB_REF_NAME:skills/split-expenses" \
            SKILL.md scripts/settle.py

      # The asset name is deliberately stable: the README points at
      # /releases/latest/download/split-expenses.zip, which only resolves if
      # every release names the file identically.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/split-expenses.zip --generate-notes
